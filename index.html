<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teachable Machine Classifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Comfortaa", "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #f4f7ff 0%, #eef4ff 100%);
        color: #663399;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 720px);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #dbe6ff;
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        color: #663399;
        animation: spin-title 3s linear infinite;
        display: inline-block;
      }

      @keyframes spin-title {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .subtitle {
        margin: 0 0 24px;
        color: #4b5563;
        line-height: 1.6;
      }

      .controls {
        position: relative;
        min-height: 72px;
        margin-bottom: 24px;
      }

      button {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border: none;
        border-radius: 999px;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        background: #d198a3;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, left 0.25s ease, top 0.25s ease;
        box-shadow: 0 10px 20px rgba(209, 152, 163, 0.2);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 24px rgba(209, 152, 163, 0.28);
      }

      #webcam-container {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
      }

      #label-container {
        display: grid;
        gap: 8px;
        color: #374151;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Teachable Machine Image Model</h1>
      <p class="subtitle">Launch the camera and let the classifier analyze the scene in real time.</p>
      <div class="controls">
        <button id="start-button" type="button" onclick="init()">Start Classifier</button>
      </div>
      <div id="webcam-container"></div>
      <div id="label-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script type="text/javascript">
    const controls = document.querySelector('.controls');
    const startButton = document.getElementById('start-button');

    function moveButtonAway(event) {
        const controlsRect = controls.getBoundingClientRect();
        const buttonRect = startButton.getBoundingClientRect();
        const distanceX = event.clientX - (buttonRect.left + buttonRect.width / 2);
        const distanceY = event.clientY - (buttonRect.top + buttonRect.height / 2);
        const distance = Math.hypot(distanceX, distanceY);

        if (distance < 180) {
            const maxLeft = Math.max(0, controlsRect.width - buttonRect.width - 20);
            const maxTop = Math.max(0, controlsRect.height - buttonRect.height - 20);
            const newLeft = Math.random() * maxLeft;
            const newTop = Math.random() * maxTop;

            startButton.style.left = `${newLeft}px`;
            startButton.style.top = `${newTop}px`;
        }
    }

    controls.addEventListener('mousemove', moveButtonAway);
    controls.addEventListener('mouseenter', moveButtonAway);
    // More API functions here:
    // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image

    // the link to your model provided by Teachable Machine export panel
    const URL = "https://teachablemachine.withgoogle.com/models/Qm3dijjZv/";

    let model, webcam, labelContainer, maxPredictions;

    // Load the image model and setup the webcam
    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // load the model and metadata
        // Refer to tmImage.loadFromFiles() in the API to support files from a file picker
        // or files from your local hard drive
        // Note: the pose library adds "tmImage" object to your window (window.tmImage)
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Convenience function to setup a webcam
        const flip = true; // whether to flip the webcam
        webcam = new tmImage.Webcam(200, 200, flip); // width, height, flip
        await webcam.setup(); // request access to the webcam
        await webcam.play();
        window.requestAnimationFrame(loop);

        // append elements to the DOM
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) { // and class labels
            labelContainer.appendChild(document.createElement("div"));
        }
    }

    async function loop() {
        webcam.update(); // update the webcam frame
        await predict();
        window.requestAnimationFrame(loop);
    }

    // run the webcam image through the image model
    async function predict() {
        // predict can take in an image, video or canvas html element
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction =
                prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            labelContainer.childNodes[i].innerHTML = classPrediction;
        }
    }
</script>
  </body>
</html>
